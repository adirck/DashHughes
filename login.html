<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api-dashsoma.webrocha.com.br; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=51"><title>DashSoma | Entrar</title>
<link rel="stylesheet" href="./style.css?v=63">
<script type="module" src="./app.js?v=63"></script>
<header><a class="brand" href="./?v=51" aria-label="DashSoma — Visão geral"><img class="brand-mark" src="./assets/favicon.svg?v=51" alt=""><span class="brand-name">DashSoma</span></a></header>
<main class="login">
  <form id="login" class="card" method="post">
    <h1>Entrar</h1>
    <label for="user">Usuário</label><input id="user" name="user" autocomplete="username" maxlength="128" required>
    <label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <button type="submit">Entrar</button>
    <p id="status" role="status"></p>
  </form>
</main>
</html>
